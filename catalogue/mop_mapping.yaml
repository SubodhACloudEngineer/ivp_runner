# Where AP check results land in the MOP workbook's "IVP Test Plan" sheet.
#
# The writer refuses to write if a row's description cell does not start
# with `expect_description`. That guards against a template whose rows have
# moved. It also refuses if an evidence cell holds text a human wrote or a
# picture someone else placed; it only replaces what it wrote itself.

schema_version: 1
sheet: IVP Test Plan
description_column: B
status_column: D
evidence_column: H   # portal screenshot (PNG) is anchored here
section_column: A    # section headers, for the interactive menu

# The status column has a dropdown limited to these values.
allowed_statuses: [Not Started, Issue Reported, In-Progress, Complete, Not Applicable]

# Check verdict (after rolling up across all APs) -> MOP status.
# ERROR and SKIP map to Not Started: the tool could not decide, so a
# human must do this row.
verdict_to_status:
  PASS: Complete
  FAIL: Issue Reported
  ERROR: Not Started
  SKIP: Not Started

rows:
  - row: 57
    test_ids: [AP-00]
    expect_description: Go to Access-points
  - row: 58
    test_ids: [AP-01]
    expect_description: Check the WLANs box
  - row: 59
    test_ids: [AP-02]
    expect_description: Check the Power mode
  - row: 60
    test_ids: [AP-03]
    expect_description: Check the status to confirm
  # One MOP row covers both uplink checks; its status is the rollup of the two.
  - row: 61
    test_ids: [AP-04, AP-05]
    expect_description: Make sure the Ethernet properties

# IVP Test Plan sections in sheet order, for the interactive menu. The header
# cell must start with `title` (checked before the menu is shown). A section
# can be run when at least one row above lies inside it; the others are
# listed as "not available yet".
sections:
  - {title: Netsec Team IVP, header_row: 5}
  - {title: Voice service IVP, header_row: 33}
  - {title: "Verify WAN EDGE SSR's - System validation", header_row: 45}
  - {title: "Verify WAN EDGE SSR's - Routing", header_row: 48}
  - {title: Verify Switches, header_row: 53}
  - {title: Verify AP, header_row: 56}
