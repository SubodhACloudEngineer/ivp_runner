# IVP check catalogue: access points.
#
# One entry per check. Each test_id is stable and never changes, even if the
# title does. `mop.description` is copied verbatim from the MOP's
# "IVP Test Plan" sheet.
#
# `pass_when` is the reviewed contract. Each line is one assertion on one
# field, and every field path must exist in docs/field_inventory.md.
# `{expect: name}` refers to the site profile (sites/<site>.yaml), which
# holds design intent. Placeholders like <port> come from `vars`, or from the
# `for_each` key.
#
# Review the rendered sentences with:
#   python -m ivp_runner.catalogue explain catalogue/ap.yaml

schema_version: 2

checks:
  - test_id: AP-00
    title: AP is connected and reporting runtime data
    mop:
      section: Verify AP
      description: Go to Access-points and select the corresponding site
    site_classes: [all]
    coverage: full
    vars: {port: {expect: uplink_port}}
    collect: {method: mist_api, source: site_device_stats}
    target: {kind: ap, select: {field: type, equals: ap}}
    pass_when:
      all:
        - {field: status, equals: connected}
        - {field: radio_stat, present: true}
        - {field: power_constrained, present: true}
        - {field: ip_stat.ip, present: true}
        - {field: ip_stat.netmask, present: true}
        - {field: ip_stat.dns, present: true}
        - {field: port_stat.<port>.up, present: true}
        - {field: port_stat.<port>.rx_errors, present: true}
        - {field: uptime, present: true}
    evidence: [status, last_seen, uptime]

  - test_id: AP-01
    title: Expected number of SSIDs broadcast on each enabled band
    mop:
      section: Verify AP
      description: Check the WLANs box to confirm the SSIDs that are being broadcasted
    site_classes: [all]
    coverage: partial
    limitation: >
      Mist AP stats report how many SSIDs each band broadcasts, not their names.
      A count catches an AP broadcasting nothing or too few, but it cannot tell
      a missing SSID from a swapped one. Matching SSID names needs a
      client-side probe that has not been built.
    requires: [AP-00]
    collect: {method: mist_api, source: site_device_stats}
    target: {kind: ap, select: {field: type, equals: ap}}
    pass_when:
      all:
        - for_each: radio_stat.<band>
          skip_if: {field: disabled, equals: true}
          all:
            - {field: num_wlans, equals: {expect: ssid_count.<band>}}
          min_evaluated: 1
    evidence: [num_wlans]

  - test_id: AP-02
    title: AP is not power-constrained (full PoE power)
    mop:
      section: Verify AP
      description: "Check the Power mode:"
    site_classes: [all]
    coverage: full
    requires: [AP-00]
    collect: {method: mist_api, source: site_device_stats}
    target: {kind: ap, select: {field: type, equals: ap}}
    pass_when:
      all:
        - {field: power_constrained, equals: false}
    # power_opmode is deliberately unused: its meaning is unknown.
    evidence: [power_src, power_needed, power_avail, power_budget]

  - test_id: AP-03
    title: Management IP within expected subnet; DNS servers match expected configuration
    mop:
      section: Verify AP
      description: >-
        Check the status to confirm the proper configuration is in place,
        Ip address, vlan, DNS and external IP address:
    site_classes: [all]
    coverage: partial
    limitation: >
      This checks the subnet, not the VLAN: the AP does not report a VLAN ID.
      It checks which DNS servers are configured, not whether DNS resolves, so
      "DNS servers match expected configuration" is not proof that DNS works.
      A real DNS-resolution check needs a client probe that has not been built.
    requires: [AP-00]
    collect: {method: mist_api, source: site_device_stats}
    target: {kind: ap, select: {field: type, equals: ap}}
    pass_when:
      all:
        - name: mgmt_ip_in_expected_subnet
          field: ip_stat.ip
          in_subnet: {expect: mgmt_subnet}
        - name: dns_servers_match_expected_configuration
          field: ip_stat.dns
          same_set_as: {expect: dns_servers}
    evidence: [ip_stat.ip, ip_stat.netmask, ip_stat.gateway, ip_stat.dns]

  - test_id: AP-04
    title: Uplink port up, at or above the expected speed, full duplex
    mop:
      section: Verify AP
      description: Make sure the Ethernet properties are correct, Full duplex and no errors are shown.
    site_classes: [all]
    coverage: full
    requires: [AP-00]
    vars: {port: {expect: uplink_port}}
    collect: {method: mist_api, source: site_device_stats}
    target: {kind: ap, select: {field: type, equals: ap}}
    pass_when:
      all:
        - {field: port_stat.<port>.up, equals: true}
        - {field: port_stat.<port>.speed, at_least: {expect: min_uplink_speed_mbps}}
        - {field: port_stat.<port>.full_duplex, equals: true}
    evidence: [lldp_stat.ap_port_name, lldp_stat.system_name, lldp_stat.port_id]

  - test_id: AP-05
    title: No new RX errors on the uplink port during the run
    mop:
      section: Verify AP
      description: Make sure the Ethernet properties are correct, Full duplex and no errors are shown.
    site_classes: [all]
    coverage: partial
    limitation: >
      Mist exposes no TX error counter for AP ports, so only RX is checked.
      rx_errors is a lifetime counter, so the check compares readings taken at
      run start and run end. The window is the run duration, with no added
      wait. The absolute value is kept in evidence.
    requires: [AP-00]
    vars: {port: {expect: uplink_port}}
    collect: {method: mist_api, source: site_device_stats, sampling: run_start_and_end}
    target: {kind: ap, select: {field: type, equals: ap}}
    pass_when:
      all:
        - field: port_stat.<port>.rx_errors
          unchanged_during_run: true
          reset_guard: uptime
    evidence: [port_stat.<port>.rx_errors, port_stat.<port>.rx_pkts, uptime]
