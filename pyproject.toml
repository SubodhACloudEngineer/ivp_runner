[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivp-runner"
version = "0.1.0"
description = "Post-deployment IVP runner for Juniper Mist site migrations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "pyyaml",
    "openpyxl",
    "pydantic>=2",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
